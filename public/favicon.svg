<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128"
    role="img"
    aria-label="Dev and badminton icon">
    <!-- Chevron ouvrant -->
    <path d="M12 20 L4 32 L12 44" fill="none" stroke="#1B4332" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" />

    <!-- Raquette stylisée -->
    <g transform="translate(20,14)">
        <!-- Cadre -->
        <ellipse cx="10" cy="10" rx="8" ry="10" fill="#95D5B2" stroke="#1B4332" stroke-width="2" />
        <!-- Cordage -->
        <g stroke="#1B4332" stroke-width="0.8" opacity="0.7">
            <path d="M2 10 H18" />
            <path d="M4 6 H16" />
            <path d="M4 14 H16" />
            <path d="M10 2 V18" />
            <path d="M6 4 V16" />
            <path d="M14 4 V16" />
        </g>
        <!-- Manche (même couleur que cadre) -->
        <rect x="8.5" y="20" width="3" height="10" rx="1" fill="#95D5B2" stroke="#1B4332"
            stroke-width="1.2" />
    </g>

    <!-- Filet oblique (slash) -->
    <g transform="translate(38,18) rotate(10)">
        <!-- Montant principal du filet -->
        <rect x="8" y="0" width="2" height="28" rx="1" fill="#1B4332" />
        <!-- Lignes horizontales partant du montant vers la gauche -->
        <g stroke="#52B788" stroke-width="0.8" opacity="0.85">
            <path d="M8 4 L2 2" />
            <path d="M8 8 L2 6" />
            <path d="M8 12 L2 10" />
            <path d="M8 16 L2 14" />
            <path d="M8 20 L2 18" />
            <path d="M8 24 L2 22" />
        </g>
        <!-- Lignes verticales fines pour donner un effet de quadrillage -->
        <g stroke="#74C69D" stroke-width="0.6" opacity="0.6">
            <path d="M7 2 L7 24" />
            <path d="M5 1 L5 23" />
            <path d="M3 0 L3 22" />
        </g>
    </g>

    <!-- Chevron fermant -->
    <path d="M52 20 L60 32 L52 44" fill="none" stroke="#1B4332" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>