<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Stronger wood grain: high-contrast, long streaks -->
    <linearGradient id="base" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#8a4a37" />
      <stop offset="35%" stop-color="#6a341f" />
      <stop offset="100%" stop-color="#4d2416" />
    </linearGradient>

    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <!-- long linear noise for streaks: low horizontal baseFrequency gives long veins -->
      <feTurbulence type="fractalNoise" baseFrequency="0.0015 0.12" numOctaves="3" seed="42" stitchTiles="stitch" result="noise" />
      <!-- emphasize contrast -->
      <feComponentTransfer in="noise" result="contrast">
        <feFuncR type="table" tableValues="0 0 0.2 0.35 0.6 1" />
        <feFuncG type="table" tableValues="0 0 0.15 0.3 0.55 0.95" />
        <feFuncB type="table" tableValues="0 0 0.1 0.25 0.45 0.9" />
      </feComponentTransfer>
      <!-- thin directional blur to accent streak direction -->
      <feGaussianBlur in="contrast" stdDeviation="0 5" result="grainblur" />
      <!-- map grain onto luminance to create dark streaks -->
      <feColorMatrix in="grainblur" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0" result="luma"/>
      <feBlend in="SourceGraphic" in2="luma" mode="multiply" />
    </filter>

    <!-- A subtle highlight stripe layer to add variety -->
    <filter id="stripes" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.001 0.3" numOctaves="2" seed="7" stitchTiles="stitch" result="snoise" />
      <feColorMatrix type="saturate" values="0.1" in="snoise" result="smono"/>
      <feGaussianBlur in="smono" stdDeviation="0.8" result="sblur" />
      <feComponentTransfer in="sblur" result="smap">
        <feFuncA type="table" tableValues="0 0 0.08 0.18 0.35 0.7" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="smap" mode="screen" />
    </filter>
  </defs>

  <!-- base rectangle with gradient and strong-grain filter applied -->
  <rect width="100%" height="100%" fill="url(#base)" filter="url(#grain)" />
  <!-- overlay subtle stripes/highlights -->
  <rect width="100%" height="100%" fill="none" filter="url(#stripes)" />

</svg>
