<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#8b4b36" />
      <stop offset="40%" stop-color="#6f3526" />
      <stop offset="100%" stop-color="#5a2a1e" />
    </linearGradient>

    <!-- wood grain filter: fractal noise + displacement to create streaks -->
    <filter id="wood" x="-10%" y="-10%" width="120%" height="120%">
      <!-- base noise, stitchable so it can tile when repeated -->
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.6" numOctaves="2" seed="7" stitchTiles="stitch" result="noise" />
      <!-- increase contrast of noise to form streaks -->
      <feComponentTransfer in="noise" result="contrast">
        <feFuncR type="gamma" amplitude="1" exponent="0.6" offset="0" />
        <feFuncG type="gamma" amplitude="1" exponent="0.6" offset="0" />
        <feFuncB type="gamma" amplitude="1" exponent="0.6" offset="0" />
      </feComponentTransfer>
      <!-- blur slightly to soften jagged artifacts -->
      <feGaussianBlur in="contrast" stdDeviation="0.6" result="grain" />
      <!-- Displace the gradient with the grain to get woody wavy lines -->
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="18" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- subtle varnish overlay to suggest finish -->
    <linearGradient id="varnish" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- base rectangle filled with the brown gradient, then filtered to add grain -->
  <rect width="100%" height="100%" fill="url(#lg)" filter="url(#wood)" />

  <!-- varnish gloss layer -->
  <rect width="100%" height="100%" fill="url(#varnish)" />
</svg>
